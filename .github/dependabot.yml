version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # CodeQL refuses a workflow whose init, analyze and upload-sarif steps differ in version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    ignore:
      # The release-policy reusable workflow is pinned by SHA-256 in
      # tests/repo_policy.rs, so a bot bump can only fail CI.
      # Bump it by hand and move the pin in the same commit.
      - dependency-name: ryanduguid/release-policy/.github/workflows/attribution-policy.yml
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns:
          - "*"
