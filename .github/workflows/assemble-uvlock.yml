name: assemble-uvlock
on:
  push:
    branches: [cursor/ponytail-audit-cuts-d043]
    paths:
      - ".github/workflows/assemble-uvlock.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact uv.lock and commit
        run: |
          set -euo pipefail
          curl -fsSL -o uv.lock "https://tmpfiles.org/dl/1787645060.63ba39587746754f/wxwN2Wxe4rYK/uv.lock"
          test "$(wc -c < uv.lock)" -eq 133946
          echo "c0021ec4be8343c204fbe773704b2e2afc37e0f5c52c0d8b56d25ab1d280b8fb  uv.lock" | sha256sum -c
          test "$(git hash-object uv.lock)" = "58b264456e357e7efbfc167223853421917e04fd"
          if grep -q 'name = "lxml"' uv.lock; then echo lxml present; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git rm -r --ignore-unmatch .uvlock-parts || true
          git rm -f .github/workflows/assemble-uvlock.yml
          git commit -m "Regenerate uv.lock without lxml."
          git push
