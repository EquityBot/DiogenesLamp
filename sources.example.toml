# Copy to sources.toml, or generate it with: lamp import links.csv
#
# Two things to know if you hand-edit this file:
#   - A table key must be a plain [A-Za-z0-9_-] id. Dots would nest tables and
#     the file would no longer load, so a seller like "shop.name" becomes
#     "shop-name". 'lamp import' derives these ids for you.
#   - 'lamp import' rewrites this file from your dump, keeping url and name.
#     Comments do not survive, so to leave a seller out use skip = true rather
#     than commenting the entry out.

[yupoo.exampleseller]
url = "https://exampleseller.x.yupoo.com"
name = "exampleseller"

# A catalogue too large to be worth the hours, or one you no longer buy from:
[yupoo.skippedseller]
url = "https://skippedseller.x.yupoo.com"
name = "skippedseller"
skip = true

[shops.taobao-shop00000000]
platform = "taobao"
url = "https://shop00000000.taobao.com/"
name = "shop00000000"
