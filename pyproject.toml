[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "diogenes-lamp"
version = "0.1.0"
description = "Browse any Yupoo catalog locally as one fast, searchable page"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "requests==2.34.2",
    "idna==3.20",
    "beautifulsoup4==4.15.0",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
lamp = "lamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
build-constraint-dependencies = [
    { requirement = "setuptools==84.0.0", hashes = ["sha256:51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670"] },
]

[tool.pytest.ini_options]
markers = ["manual: parser canaries against saved samples, excluded from CI"]
addopts = "-m 'not manual'"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Widened baseline: pycodestyle E4/E7/E9, all of pyflakes, and import sorting.
# Keep Decimal("10.00") money literals.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Test modules may import a symbol only to prove it is part of the public
# interface (for example, Source from lamp.ingest), without using it in an assert.
"tests/*.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
packages = ["lamp"]
ignore_missing_imports = true
pretty = true
