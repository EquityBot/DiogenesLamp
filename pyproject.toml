[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diogenes-lamp"
version = "0.1.0"
description = "Browse any Yupoo catalog locally as one fast, searchable page"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
lamp = "lamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["manual: live-network tests, excluded from CI"]
addopts = "-m 'not manual'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.ruff.lint.per-file-ignores]
# Test modules may import a symbol only to prove it is part of the public
# interface (e.g. Source from lamp.ingest), without using it in an assert.
"tests/*.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
packages = ["lamp"]
ignore_missing_imports = true
pretty = true
