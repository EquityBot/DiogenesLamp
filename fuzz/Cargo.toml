[package]
name = "diogenes-lamp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
diogenes-lamp = { path = ".." }

# A separate workspace, so the lamp crate's own build never compiles the fuzzer.
[workspace]
members = ["."]

[[bin]]
name = "html_parse"
path = "fuzz_targets/html_parse.rs"
test = false
doc = false
bench = false
